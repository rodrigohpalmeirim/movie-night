name: docker

# Cutting a release is two commands, run on a clean main:
#
#   bun run release minor    # or patch / major — bumps package.json, commits, tags vX.Y.Z
#   git push --follow-tags
#
# The tag build publishes X.Y.Z / X.Y / X, moves :latest, and creates the
# GitHub Release with auto-generated notes. Plain pushes to main publish
# :main (and a sha tag) only — so :latest always means "latest release".

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the GitHub Release on tag builds
      packages: write
    steps:
      # Full history: the release step walks back to the previous tag for its
      # notes, and a shallow checkout can see neither the tags nor the commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # semver tags only materialize on v* tag builds; branch builds get
      # `main` + sha. `latest` rides the semver tags (metadata-action's
      # `latest=auto` default), never the branch.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/rodrigohpalmeirim/movie-night
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image is pushed before the release exists, so a release note
      # never points at a tag nobody can pull yet. Notes are the commit
      # subjects since the previous tag — GitHub's --generate-notes only
      # itemizes pull requests, and this repo commits straight to main.
      - name: create github release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            git log --reverse --format='- %s' ${prev:+$prev..}"$GITHUB_REF_NAME" | grep -v '^- release v' || true
            if [ -n "$prev" ]; then
              echo
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$prev...$GITHUB_REF_NAME"
            fi
          } > /tmp/notes.md
          gh release create "$GITHUB_REF_NAME" --notes-file /tmp/notes.md
