<!doctype html>
<!--
  Source for docs/title-banner.png (the README title banner): the app's own
  landing "box lid" in wide format — board plate on the felt, eyebrow, slab
  wordmark, the double rule — with the verdict stamped over the corner:
  UNANIMOUS, for once.
  Captured headless from the repo root (fonts load from node_modules, so
  `bun install` first):

    chrome --headless --screenshot=docs/title-banner.png \
      --window-size=880,250 --force-device-scale-factor=2 \
      --hide-scrollbars docs/title-banner.html

  Every colour, font and shadow is copied from src/app.css; if the design
  system moves, re-copy and re-capture.
-->
<html lang="en">
<meta charset="utf-8">
<style>
  @font-face {
    font-family: 'Alfa Slab One';
    src: url('../node_modules/@fontsource/alfa-slab-one/files/alfa-slab-one-latin-400-normal.woff2') format('woff2');
    font-weight: 400;
  }
  @font-face {
    font-family: 'Oswald Variable';
    src: url('../node_modules/@fontsource-variable/oswald/files/oswald-latin-wght-normal.woff2') format('woff2-variations');
    font-weight: 200 700;
  }

  :root {
    --felt: #4c141c;
    --felt-deep: #2c0b10;
    --board: #efe0bf;
    --board-shade: #cdb283;
    --ink: #1a1512;
    --ink-soft: #6b5b48;
    --brass: #efae43;
  }

  * { margin: 0; box-sizing: border-box; }

  body {
    width: 880px;
    height: 250px;
    display: grid;
    place-items: center;
    /* The app's felt weave, verbatim, over the same oxblood vignette. */
    background:
      repeating-linear-gradient(45deg, rgb(255 226 210 / 3.5%) 0 2px, transparent 2px 7px),
      repeating-linear-gradient(-45deg, rgb(0 0 0 / 11%) 0 2px, transparent 2px 7px),
      radial-gradient(1100px 720px at 50% 30%, var(--felt), var(--felt-deep));
    overflow: hidden;
  }

  /* The lid: a flat board tile with the two-ply dealt-card edge. */
  .lid {
    position: relative;
    padding: 24px 46px 22px;
    border: 2px solid var(--ink);
    border-radius: 6px;
    background: var(--board);
    color: var(--ink);
    text-align: center;
    transform: rotate(-0.6deg);
    box-shadow:
      1px 2px 0 0 var(--board-shade),
      2px 4px 0 0 var(--board-shade),
      3px 6px 0 0 var(--ink);
  }

  .eyebrow {
    font-family: 'Oswald Variable', sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  h1 {
    margin-top: 4px;
    font-family: 'Alfa Slab One', serif;
    font-weight: 400;
    font-size: 58px;
    letter-spacing: -0.015em;
    line-height: 1.02;
  }

  /* The lid's double rule: solid ink, then the dashed tear line. */
  .rule { margin-top: 12px; height: 3px; background: var(--ink); }
  .dash { margin-top: 3px; border-top: 2px dashed var(--board-shade); }

  /* The verdict, stamped over the corner — the app's seal grammar, verbatim. */
  .seal {
    position: absolute;
    top: -14px;
    right: -20px;
    display: inline-block;
    font-size: 15px;
    padding: .12em;
    border: .12em solid var(--ink);
    border-radius: .18em;
    background: var(--brass);
    color: var(--ink);
    box-shadow: 0 .1em 0 0 rgb(26 21 18 / 40%);
    transform: rotate(7deg);
  }
  .seal-face {
    display: block;
    border: .09em solid currentColor;
    border-radius: .1em;
    padding: .2em .5em .26em;
    font-family: 'Alfa Slab One', serif;
    font-size: 1em;
    letter-spacing: .04em;
    line-height: 1;
    text-transform: uppercase;
    text-align: center;
  }
  .seal-note {
    display: block;
    margin-top: .22em;
    border-top: .09em solid currentColor;
    padding-top: .18em;
    font-family: 'Oswald Variable', sans-serif;
    font-size: .44em;
    font-weight: 600;
    letter-spacing: .16em;
  }
</style>
<body>
  <div class="lid">
    <p class="eyebrow">Pick what to watch, together</p>
    <h1>Movie Night</h1>
    <div class="rule"></div>
    <div class="dash"></div>
    <span class="seal" aria-hidden="true">
      <span class="seal-face">Unanimous<span class="seal-note">For once</span></span>
    </span>
  </div>
</body>
</html>
