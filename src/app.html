<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<!-- Installable PWA: manifest, icons, theme colour. No service worker — offline
		     is explicitly not a v1 requirement and every action needs the network.

		     The manifest link itself is emitted from src/routes/+layout.svelte, not
		     here: inside a group it must point at that group's own manifest, so the
		     icon opens the group instead of the create-a-group screen. Browsers honour
		     the FIRST rel=manifest in the document, so there can only be one, and the
		     one that knows which group this is is the layout's. -->
		<link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
		<!-- Raster fallback for browsers that ignore SVG favicons. -->
		<link rel="icon" href="%sveltekit.assets%/favicon-96.png" sizes="96x96" type="image/png" />
		<!-- iOS ignores the manifest icons; it needs its own opaque, full-bleed PNG. -->
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="mask-icon" href="%sveltekit.assets%/mask-icon.svg" color="#efae43" />
		<!-- One theme, always on (see app.css), so one theme colour: the felt. No
		     media-scoped pair, because there is no light mode to switch to. -->
		<meta name="theme-color" content="#4c141c" />
		<!-- Standalone display on iOS: the prefixed meta is still what Safari reads,
		     the unprefixed one is the standard Chrome asks for. Status bar is opaque
		     ("black", not "black-translucent") because only the bottom safe-area inset
		     is padded — a translucent bar would slide content under the notch. -->
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black" />
		<!-- The home-screen title iOS reads is emitted from src/routes/+layout.svelte
		     alongside the manifest link, for the same reason: inside a group it is the
		     group's name. One tag, one place. -->
		<!-- No third-party CDN assets: fonts, scripts and styles are all self-hosted,
		     so the invite token in the URL cannot leak through a Referer to anyone
		     except image.tmdb.org (and Referrer-Policy: same-origin covers that). -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-felt text-chalk antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
