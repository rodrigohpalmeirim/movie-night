<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Movie Night">
	<title>Movie Night</title>
	<!-- Maskable and apple-touch source: the same board-token-and-seal as icon.svg,
	     but full-bleed (the platform applies its own mask) and pulled in tighter.

	     The token measures 300 x 236 centred on the canvas, so its furthest corner
	     is 200px from the centre — inside the 205px safe circle a maskable icon is
	     guaranteed to keep (40% of 512). Everything outside that is felt, which is
	     opaque edge to edge, so any mask shape crops to table rather than to a
	     transparent hole. -->
	<rect width="512" height="512" fill="#4c141c" />
	<g stroke="#000000" stroke-width="10" stroke-opacity="0.14">
		<path d="M-64 128 L128 -64 M-64 256 L256 -64 M-64 384 L384 -64 M-64 512 L512 -64 M64 576 L576 64 M192 576 L576 192 M320 576 L576 320 M448 576 L576 448" />
	</g>
	<!-- Board token: x 106–406, y 138–374. -->
	<rect x="106" y="138" width="300" height="236" rx="24" ry="24" fill="#efe0bf" stroke="#1a1512" stroke-width="18" />
	<path d="M114 340 H398" stroke="#cdb283" stroke-width="11" stroke-dasharray="20 16" stroke-linecap="round" />
	<!-- The seal, struck at the app's own -8 degrees. -->
	<g transform="rotate(-8 256 246)">
		<rect x="138" y="180" width="236" height="132" rx="19" ry="19" fill="#efae43" stroke="#1a1512" stroke-width="17" />
		<rect x="163" y="205" width="186" height="82" rx="9" ry="9" fill="none" stroke="#1a1512" stroke-width="13" />
		<path d="M205 247 L232 273 L299 220" fill="none" stroke="#1a1512" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
	</g>
</svg>
