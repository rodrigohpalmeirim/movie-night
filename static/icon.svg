<svg xmlns="http://www.w3.org/2000/svg" width="464" height="324" viewBox="0 0 464 324" role="img" aria-label="Movie Night">
	<title>Movie Night</title>
	<!-- The favicon: the ink seal alone, no felt behind it. The viewBox hugs the
	     rotated seal's bounding box so the stamp uses every pixel a browser tab
	     gives it; the transparent background lets it sit on any tab bar.

	     Colours are the shipped tokens: brass #EFAE43, ink #1A1512. The launcher
	     icons (icon-rounded.svg, icon-maskable.svg) strike the same seal on the
	     felt table. -->
	<g transform="rotate(-7 232 162)">
		<rect x="27" y="37" width="410" height="250" rx="32" ry="32" fill="#efae43" stroke="#1a1512" stroke-width="22" />
		<rect x="71" y="81" width="322" height="162" rx="15" ry="15" fill="none" stroke="#1a1512" stroke-width="17" />
		<path d="M156 162 L200 204 L292 126" fill="none" stroke="#1a1512" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" />
	</g>
</svg>
