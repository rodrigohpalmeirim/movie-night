<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Movie Night">
	<title>Movie Night</title>
	<!-- Source of truth for the favicon and for the "any"-purpose PWA icons.
	     Colours match the app shell: indigo accent (#4f46e5 sits between the two
	     gradient stops) on the dark neutral-950 background. Self-hosted, no
	     third-party assets. Rounded corners because "any" icons are shown
	     unmasked; see icon-maskable.svg for the full-bleed variant. -->
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#6366f1" />
			<stop offset="1" stop-color="#4338ca" />
		</linearGradient>
	</defs>
	<rect width="512" height="512" rx="112" ry="112" fill="url(#bg)" />
	<!-- Film-reel sprocket ring: a dashed circle (30 evenly spaced perforations). -->
	<circle cx="256" cy="256" r="148" fill="none" stroke="#ffffff" stroke-width="26" stroke-dasharray="20 11" />
	<!-- Play triangle; the stroke rounds the corners. -->
	<path d="M214 184 L346 256 L214 328 Z" fill="#ffffff" stroke="#ffffff" stroke-width="26" stroke-linejoin="round" stroke-linecap="round" />
</svg>
