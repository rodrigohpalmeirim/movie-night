<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
	<title>Movie Night</title>
	<!-- Safari pinned-tab mask: single colour, transparent background. Safari uses
	     only the alpha channel and tints it with the link's `color` attribute, so
	     this is the seal reduced to its silhouette — plate, inner rule and tick,
	     with no palette at all. Same geometry as the favicon (icon.svg). -->
	<g transform="rotate(-7 256 256)">
		<rect x="66" y="136" width="380" height="240" rx="30" ry="30" fill="none" stroke="#000000" stroke-width="24" />
		<rect x="106" y="176" width="300" height="160" rx="14" ry="14" fill="none" stroke="#000000" stroke-width="17" />
		<path d="M192 256 L232 294 L320 222" fill="none" stroke="#000000" stroke-width="38" stroke-linecap="round" stroke-linejoin="round" />
	</g>
</svg>
